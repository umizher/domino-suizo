<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dominó – Inicio</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #0b1220; color: #e8eefc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    h1 { font-size: 28px; margin: 0 0 6px; text-align: center; }
    .subtitle { color: #9fb1db; font-size: 14px; margin: 0 0 40px; text-align: center; }

    .apps { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 760px; }

    .app-card {
      background: #121a2b; border: 1px solid #22304f; border-radius: 20px;
      padding: 32px 28px; width: 320px; text-decoration: none; color: #e8eefc;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color .2s, transform .15s;
      cursor: pointer;
    }
    .app-card:hover { border-color: #2b65ff; transform: translateY(-3px); }
    .app-card.liga:hover { border-color: #ffd700; }

    .app-icon { font-size: 48px; line-height: 1; }
    .app-name { font-size: 20px; font-weight: 800; }
    .app-desc { font-size: 13px; color: #9fb1db; line-height: 1.5; }

    .tag {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; width: fit-content;
    }
    .tag.blue   { background: #1a2e6e; color: #7eb3ff; border: 1px solid #2b65ff; }
    .tag.gold   { background: #2a2000; color: #ffd700; border: 1px solid #6b5900; }

    footer { margin-top: 48px; font-size: 11px; color: #3a4f72; text-align: center; }
  </style>
</head>
<body>

<h1>🁫 Dominó</h1>
<p class="subtitle">Elige la modalidad</p>

<div class="apps">

  <a class="app-card" href="suizo.html">
    <div class="app-icon">🏆</div>
    <div class="app-name">Dominó Suizo</div>
    <div class="app-desc">
      Torneo por rondas con emparejamiento suizo.<br>
      5 rondas · Ranking automático · Sin empates.
    </div>
    <span class="tag blue">Torneo</span>
  </a>

  <a class="app-card liga" href="liga.html">
    <div class="app-icon">📅</div>
    <div class="app-name">Liga Mensual</div>
    <div class="app-desc">
      Registro de sesiones semanales (viernes).<br>
      Ranking mensual · Cierre de mes · Racha 🔥 · Sync entre dispositivos.
    </div>
    <span class="tag gold">Liga</span>
  </a>

</div>

<footer>Dominó – v2</footer>

</body>
</html>
